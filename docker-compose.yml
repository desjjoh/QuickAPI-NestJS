# LOCAL DEVELOPMENT ONLY.
# Staging is defined separately in docker-compose.staging.yml; do not layer that
# file over this one because these credentials and published data-store ports
# are intentionally convenient local defaults.
services:
  redis:
    image: redis:7-alpine
    container_name: quickapi-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - quickapi_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4
    container_name: quickapi-mysql
    restart: unless-stopped

    cpus: '1.0'
    mem_limit: 2g

    ports:
      - '3307:3306'

    command:
      - '--innodb-buffer-pool-size=512M'
      - '--max-connections=25'

    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: quickapi
      MYSQL_USER: quickapi_app
      MYSQL_PASSWORD: quickapi_password

    volumes:
      - quickapi_mysql_data:/var/lib/mysql

    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-proot_password']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migration:
    build:
      context: .
      dockerfile: Dockerfile
    restart: 'no'
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: quickapi_app
      DB_PASSWORD: quickapi_password
      DB_DATABASE: quickapi
      DB_SYNC: 'false'
    command: ['npm', 'run', 'migration:run:prod']

  api:
    build:
      context: .
      dockerfile: Dockerfile

    cpus: '0.5'
    mem_limit: 512m

    container_name: quickapi-api
    restart: unless-stopped

    depends_on:
      migration:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - '4000:4000'

    env_file:
      - .env

    environment:
      NODE_ENV: production

      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: quickapi_app
      DB_PASSWORD: quickapi_password
      DB_DATABASE: quickapi

      PUBLIC_API_URL: https://localhost:4000

      HTTPS_ENABLED: 'true'
      HTTPS_KEY_PATH: certs/localhost-key.pem
      HTTPS_CERT_PATH: certs/localhost.pem

      COOKIE_SECURE: 'true'

      REDIS_HOST: redis
      REDIS_PORT: 6379

      NODE_OPTIONS: '--max-old-space-size=384'

    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-check-certificate',
          '--quiet',
          '--output-document=/dev/null',
          'https://localhost:4000/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    volumes:
      - ./certs:/app/certs:ro
      - ./public:/app/public
      - ./tmp:/app/tmp

volumes:
  quickapi_mysql_data:
  quickapi_redis_data:
