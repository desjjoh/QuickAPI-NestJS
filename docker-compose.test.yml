# Disposable dependencies for local integration and E2E tests. This topology is
# intentionally independent from the ordinary development Compose stack.
name: quickapi-nestjs-test

services:
  mysql-test:
    image: mysql:8.4
    ports:
      - '127.0.0.1:3308:3306'
    environment:
      MYSQL_ROOT_PASSWORD: quickapi_test_root_password
      MYSQL_DATABASE: quickapi_test
      MYSQL_USER: quickapi_test_app
      MYSQL_PASSWORD: quickapi_test_password
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u"$$MYSQL_USER" -D"$$MYSQL_DATABASE" --execute="SELECT 1"',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis-test:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6380:6379'
    environment:
      REDIS_PASSWORD: quickapi_test_redis_password
    command:
      [
        'sh',
        '-c',
        'exec redis-server --save "" --appendonly no --requirepass "$$REDIS_PASSWORD"',
      ]
    tmpfs:
      - /data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli -a "$$REDIS_PASSWORD" ping 2>/dev/null | grep PONG',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
