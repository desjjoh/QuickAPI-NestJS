# Standalone staging topology. Run this file by itself; docker-compose.yml is
# deliberately local-only and must not be merged into staging.
x-api-environment: &api-environment
  # Application configuration, including secrets, lives in .env.staging. These
  # are the only topology-owned overrides: container DNS names, production
  # validation, and TLS termination at the ingress.
  NODE_ENV: production
  DB_HOST: mysql
  DB_PORT: 3306
  REDIS_HOST: redis
  REDIS_PORT: 6379
  DB_SYNC: 'false'
  HTTPS_ENABLED: 'false'
  COOKIE_SECURE: 'true'

services:
  preflight:
    image: ${QUICKAPI_IMAGE:?Set QUICKAPI_IMAGE to the release image digest}
    restart: 'no'
    env_file:
      - .env.staging
    command: ['npm', 'run', 'staging:preflight:prod']
    volumes:
      - ./.env.staging:/app/.env.staging:ro
    networks:
      - private

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        'sh',
        '-c',
        'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"; else exec redis-server --appendonly yes; fi',
      ]
    env_file:
      - .env.staging
    expose:
      - '6379'
    volumes:
      - quickapi_redis_data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'if [ -n "$$REDIS_PASSWORD" ]; then REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping 2>/dev/null; else redis-cli ping; fi | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - private

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - '--innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-512M}'
      - '--max-connections=${MYSQL_MAX_CONNECTIONS:-50}'
    env_file:
      - .env.staging
    expose:
      - '3306'
    volumes:
      - quickapi_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - private

  migration:
    image: ${QUICKAPI_IMAGE:?Set QUICKAPI_IMAGE to the release image digest}
    restart: 'no'
    depends_on:
      preflight:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    env_file:
      - .env.staging
    environment: *api-environment
    command: ['npm', 'run', 'migration:run:prod']
    networks:
      - private

  geoip-init:
    image: ${QUICKAPI_IMAGE:?Set QUICKAPI_IMAGE to the release image digest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: 'no'
    depends_on:
      preflight:
        condition: service_completed_successfully
    env_file:
      - .env.staging
    environment:
      IP_LOCATION_DATA_DIR: /app/data/geoip
    command: ['npm', 'run', 'geoip:update:prod']
    volumes:
      - quickapi_geoip:/app/data/geoip
    networks:
      - private

  api:
    image: ${QUICKAPI_IMAGE:?Set QUICKAPI_IMAGE to the release image digest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      geoip-init:
        condition: service_completed_successfully
      migration:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *api-environment
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=384}
    env_file:
      - .env.staging
    expose:
      - '4000'
    volumes:
      - quickapi_uploads:/app/public
      - quickapi_tmp:/app/tmp
      - quickapi_geoip:/app/data/geoip:ro
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--output-document=/dev/null',
          'http://localhost:4000/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - private
      - ingress

volumes:
  quickapi_mysql_data:
  quickapi_redis_data:
  quickapi_uploads:
  quickapi_tmp:
  quickapi_geoip:

networks:
  private:
    internal: true
  ingress:
    external: true
    name: ${INGRESS_NETWORK:-quickapi-ingress}
