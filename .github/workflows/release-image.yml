name: Release image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      git-ref:
        description: Commit SHA that already has a successful CI run
        required: true
        type: string
      staging-release:
        description: Optional human-readable staging tag (for example staging-2026-07-30)
        required: false
        type: string

permissions:
  contents: read
  actions: read
  packages: write
  security-events: write

concurrency:
  group: release-image-${{ github.event.workflow_run.head_sha || inputs.git-ref }}
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
  IMAGE_REPOSITORY: ${{ vars.CONTAINER_REPOSITORY || github.repository }}

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    outputs:
      quickapi-image: ${{ steps.immutable.outputs.quickapi-image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Resolve and validate release inputs
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_SHA: ${{ inputs.git-ref }}
          REQUESTED_RELEASE: ${{ inputs.staging-release || vars.STAGING_RELEASE_IDENTIFIER }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${WORKFLOW_SHA:-$REQUESTED_SHA}"
          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'git-ref must be a full commit SHA' >&2; exit 1; }
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=$sha&status=success" --jq '.total_count')"
            test "$count" -gt 0 || { echo "No successful CI run exists for $sha" >&2; exit 1; }
          fi
          repository="$(printf '%s' "$IMAGE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image="$REGISTRY/$repository"
          release="${REQUESTED_RELEASE:-}"
          if [[ -n "$release" && ! "$release" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo 'staging-release is not a valid OCI tag' >&2
            exit 1
          fi
          echo "sha=${sha,,}" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Read application version and build metadata
        id: metadata
        env:
          STAGING_RELEASE: ${{ steps.release.outputs.release }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          built="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          tags="${{ steps.release.outputs.image }}:${{ steps.release.outputs.sha }}"
          tags="$tags"$'\n'"${{ steps.release.outputs.image }}:$version"
          if [[ -n "$STAGING_RELEASE" ]]; then
            tags="$tags"$'\n'"${{ steps.release.outputs.image }}:$STAGING_RELEASE"
          fi
          {
            echo "version=$version"
            echo "built=$built"
            echo 'tags<<EOF'
            echo "$tags"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - name: Log in to selected registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || github.token }}

      # This is the only image build in the release workflow. All tags point to
      # the manifest digest emitted by this step.
      - name: Build and push release image once
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
            org.opencontainers.image.created=${{ steps.metadata.outputs.built }}

      - name: Capture immutable deployment reference
        run: |
          reference="${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}"
          echo "QUICKAPI_IMAGE=$reference" | tee release-image.env
          echo "quickapi-image=$reference" >> "$GITHUB_OUTPUT"
          echo "### Release image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`QUICKAPI_IMAGE=$reference\`" >> "$GITHUB_STEP_SUMMARY"
        id: immutable

      - name: Generate SPDX SBOM from immutable image
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: quickapi.spdx.json

      - name: Report high-severity vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
          format: table
          output: high-vulnerabilities.txt
          severity: HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Block unresolved critical vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: critical-vulnerabilities.sarif
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - name: Upload vulnerability report to code scanning
        if: always() && hashFiles('critical-vulnerabilities.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: critical-vulnerabilities.sarif

      - name: Publish release evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-evidence-${{ steps.release.outputs.sha }}
          path: |
            release-image.env
            quickapi.spdx.json
            high-vulnerabilities.txt
            critical-vulnerabilities.sarif
            security/container-vulnerability-exceptions.md
          if-no-files-found: warn
