name: Release image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      git-ref:
        description: Commit SHA that already has a successful CI run
        required: true
        type: string
      staging-release:
        description: Optional human-readable staging tag (for example staging-2026-07-30)
        required: false
        type: string

permissions:
  contents: read
  actions: read
  packages: write
  security-events: write

concurrency:
  group: release-image-${{ github.event.workflow_run.head_sha || inputs.git-ref }}
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'ghcr.io' }}
  IMAGE_REPOSITORY: ${{ vars.CONTAINER_REPOSITORY || github.repository }}
  # Track Trivy's current scanner so newly released distro versions (such as
  # Alpine 3.24) are interpreted by scanner logic that understands them.
  TRIVY_SCANNER_IMAGE: aquasec/trivy:latest
  REGCTL_IMAGE: ghcr.io/regclient/regctl:latest

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    # Keep release tooling on a deliberate runner image instead of inheriting
    # a future ubuntu-latest migration without validation.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    outputs:
      quickapi-image: ${{ steps.immutable.outputs.quickapi-image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Resolve and validate release inputs
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_SHA: ${{ inputs.git-ref }}
          REQUESTED_RELEASE: ${{ inputs.staging-release || vars.STAGING_RELEASE_IDENTIFIER }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${WORKFLOW_SHA:-$REQUESTED_SHA}"
          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'git-ref must be a full commit SHA' >&2; exit 1; }
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=$sha&status=success" --jq '.total_count')"
            test "$count" -gt 0 || { echo "No successful CI run exists for $sha" >&2; exit 1; }
          fi
          repository="$(printf '%s' "$IMAGE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image="$REGISTRY/$repository"
          release="${REQUESTED_RELEASE:-}"
          if [[ -n "$release" && ! "$release" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo 'staging-release is not a valid OCI tag' >&2
            exit 1
          fi
          echo "sha=${sha,,}" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Read application version and build metadata
        id: metadata
        env:
          STAGING_RELEASE: ${{ steps.release.outputs.release }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          built="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          tags="${{ steps.release.outputs.image }}:${{ steps.release.outputs.sha }}"
          tags="$tags"$'\n'"${{ steps.release.outputs.image }}:$version"
          if [[ -n "$STAGING_RELEASE" ]]; then
            tags="$tags"$'\n'"${{ steps.release.outputs.image }}:$STAGING_RELEASE"
          fi
          {
            echo "version=$version"
            echo "built=$built"
            echo 'tags<<EOF'
            echo "$tags"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Prepare local candidate directory
        run: mkdir -p "$RUNNER_TEMP/release-candidate"
      - uses: docker/setup-buildx-action@v4

      # One unpublished build. OCI preserves runtime, provenance, and SBOM
      # manifests; release tags are created only after the shared gate passes.
      - name: Build unpublished release candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.sha }}
          outputs: type=oci,dest=${{ runner.temp }}/release-candidate/image.tar
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
            org.opencontainers.image.created=${{ steps.metadata.outputs.built }}

      - name: Scan candidate and enforce critical vulnerability gate
        id: scan
        env:
          RELEASE_SCAN_CACHE: ${{ runner.temp }}/trivy-cache
        run: node .github/scripts/release-check.cjs scan "$RUNNER_TEMP/release-candidate/image.tar" "$RUNNER_TEMP/release-evidence"

      - name: Log in to selected registry after scan approval
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || github.token }}

      - name: Publish the exact approved archive and release tags
        id: immutable
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_TAGS: ${{ steps.metadata.outputs.tags }}
          RELEASE_DIGEST: ${{ steps.build.outputs.digest }}
        run: node .github/scripts/release-publish.cjs "$RUNNER_TEMP/release-candidate/image.tar" "$RUNNER_TEMP/release-evidence"

      - name: Upload vulnerability report to code scanning
        if: always() && steps.scan.outputs.sarif == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/release-evidence/vulnerabilities.sarif
        continue-on-error: true

      - name: Retain release and failure evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-evidence-${{ steps.release.outputs.sha }}
          path: |
            ${{ runner.temp }}/release-evidence/
            security/container-vulnerability-exceptions.json
            security/container-vulnerability-exceptions.md
          if-no-files-found: warn
