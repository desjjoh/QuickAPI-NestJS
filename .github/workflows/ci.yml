name: CI

on:
  push:
    branches:
      - main
      - staging
      - dev
  pull_request:
    branches:
      - main
      - staging
      - dev

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    env:
      POSTMARK_ENABLED: 'false'
      POSTMARK_SERVER_TOKEN: POSTMARK_TEST_TOKEN
      POSTMARK_FROM_EMAIL: noreply@test.example.com
      R2_ACCOUNT_ID: cloudflare-test-account
      R2_ENDPOINT: https://cloudflare-test-account.r2.cloudflarestorage.com
      R2_ACCESS_KEY_ID: R2_TEST_ACCESS_KEY_ID
      R2_SECRET_ACCESS_KEY: R2_TEST_SECRET_ACCESS_KEY
      R2_BUCKET_NAME: quickapi-test
      R2_PUBLIC_BASE_URL: https://assets.test.example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project checks
        run: npm run check

  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    needs: check

    services:
      mysql:
        image: mysql:8.4
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: quickapi_test
          MYSQL_USER: quickapi_app
          MYSQL_PASSWORD: quickapi_password
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=20s
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=5s

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: quickapi_app
      DB_PASSWORD: quickapi_password
      DB_DATABASE: quickapi_test
      TEST_DB_ENABLED: true
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 3306
      TEST_DB_USER: quickapi_app
      TEST_DB_PASSWORD: quickapi_password
      TEST_DB_DATABASE: quickapi_test
      POSTMARK_ENABLED: 'false'
      POSTMARK_SERVER_TOKEN: POSTMARK_TEST_TOKEN
      POSTMARK_FROM_EMAIL: noreply@test.example.com
      R2_ACCOUNT_ID: cloudflare-test-account
      R2_ENDPOINT: https://cloudflare-test-account.r2.cloudflarestorage.com
      R2_ACCESS_KEY_ID: R2_TEST_ACCESS_KEY_ID
      R2_SECRET_ACCESS_KEY: R2_TEST_SECRET_ACCESS_KEY
      R2_BUCKET_NAME: quickapi-test
      R2_PUBLIC_BASE_URL: https://assets.test.example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Run migrations
        run: npm run migration:run

      - name: Show migration status
        run: npm run migration:show

      - name: Revert migrations
        run: npm run migration:revert

      - name: Show reverted migration status
        run: npm run migration:show

      - name: Run migrations again
        run: npm run migration:run

      - name: Show final migration status
        run: npm run migration:show

      - name: Run E2E tests
        run: npm run test:e2e
