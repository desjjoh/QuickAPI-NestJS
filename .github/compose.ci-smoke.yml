services:
  mysql:
    image: mysql:8.4
    env_file: ci-smoke.env
    healthcheck:
      test:
        [
          CMD-SHELL,
          'mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD"',
        ]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [smoke]

  redis:
    image: redis:7-alpine
    env_file: ci-smoke.env
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    healthcheck:
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [smoke]

  preflight:
    image: ${SMOKE_IMAGE:?Set SMOKE_IMAGE to the built image ID}
    env_file: ci-smoke.env
    volumes: ['./ci-smoke.env:/app/.env.staging:ro']
    command: [npm, run, staging:preflight:prod]
    networks: [smoke]

  geoip-init:
    image: ${SMOKE_IMAGE:?Set SMOKE_IMAGE to the built image ID}
    env_file: ci-smoke.env
    volumes: [geoip:/app/data/geoip]
    command:
      - node
      - -e
      - |
        const fs=require('fs/promises');
        const base='https://raw.githubusercontent.com/maxmind/MaxMind-DB/main/test-data/';
        Promise.all([['GeoLite2-Country.mmdb','GeoIP2-Country-Test.mmdb'],['GeoLite2-City.mmdb','GeoIP2-City-Test.mmdb']].map(async ([to,from])=>{const r=await fetch(base+from);if(!r.ok)throw new Error(`$${from}: HTTP $${r.status}`);await fs.writeFile('/app/data/geoip/'+to,Buffer.from(await r.arrayBuffer()));console.log(`initialized $${to}`)})).catch(e=>{console.error(e);process.exit(1)})
    networks: [smoke]

  migration:
    image: ${SMOKE_IMAGE:?Set SMOKE_IMAGE to the built image ID}
    env_file: ci-smoke.env
    command: [npm, run, migration:run:prod]
    networks: [smoke]

  api:
    image: ${SMOKE_IMAGE:?Set SMOKE_IMAGE to the built image ID}
    env_file: ci-smoke.env
    init: true
    depends_on:
      migration:
        condition: service_completed_successfully
    ports: ['127.0.0.1:4000:4000']
    volumes: [geoip:/app/data/geoip:ro]
    stop_grace_period: 20s
    networks: [smoke]

volumes:
  geoip:
networks:
  smoke:
